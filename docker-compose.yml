services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: multik
      POSTGRES_USER: multik
      # Senha apenas para desenvolvimento local — não use em produção
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multik_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multik"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.example   # .env sobrescreve se existir
    environment:
      DATABASE_URL: postgresql://multik:${POSTGRES_PASSWORD:-multik_dev}@db:5432/multik
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Hot reload em dev — não use em produção
      - ./backend:/app

volumes:
  postgres_data:
