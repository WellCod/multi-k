[project]
name = "multi-k"
version = "0.1.0"
description = "Multicálculo e gestão de seguros"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "argon2-cffi>=23.1.0,<25.0.0",
    "structlog>=24.1.0,<26.0.0",
    "reportlab>=4.0.0,<5.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "PyJWT[cryptography]>=2.8.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "respx>=0.21.0,<1.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# --- Ruff ---
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (segurança)
    "LOG", # flake8-logging
]
ignore = [
    "S101", # assert em testes é OK
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"app/infra/seed_demo.py" = ["S311"]  # random para dados demo, não criptografia

# --- Mypy ---
[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["structlog.*", "argon2.*", "asyncpg.*", "reportlab.*", "openpyxl.*", "jwt.*"]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
