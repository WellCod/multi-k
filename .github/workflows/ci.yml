name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Gitleaks — bloqueia merge se encontrar segredo no código
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Scan de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Backend — lint, tipos, testes, arquitetura
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    needs: secrets-scan

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: multik_test
          POSTGRES_USER: multik
          POSTGRES_PASSWORD: multik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://multik:multik_test@localhost:5432/multik_test
      SECRET_KEY: ci-secret-key-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
        working-directory: backend

      - name: Tipos (mypy strict)
        run: mypy app
        working-directory: backend

      - name: Testes (pytest)
        run: pytest -v --tb=short
        working-directory: backend

      - name: Teste de arquitetura — isolamento Yelum
        run: |
          echo "Verificando que símbolos Yelum não vazam para fora de adapters/yelum/"
          if grep -ri --include="*.py" \
            "yelum\|BrokerProposalNumber\|CoverageCode\|CommercialProductCode" \
            app/domain app/api app/infra app/main.py 2>/dev/null; then
            echo "FALHA: referência a Yelum encontrada fora de adapters/yelum/"
            exit 1
          fi
          echo "OK: isolamento mantido."
        working-directory: backend

  # ---------------------------------------------------------------------------
  # Frontend — tipos e build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Node / TypeScript)
    runs-on: ubuntu-latest
    needs: secrets-scan

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install
        working-directory: frontend

      - name: Checagem de tipos (tsc)
        run: npm run type-check
        working-directory: frontend

      - name: Build de produção
        run: npm run build
        working-directory: frontend
