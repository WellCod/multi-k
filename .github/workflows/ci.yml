name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Gitleaks — bloqueia merge se encontrar segredo no código
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Scan de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Backend — lint, tipos, testes, arquitetura
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    needs: secrets-scan

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: multik_test
          POSTGRES_USER: multik
          POSTGRES_PASSWORD: multik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://multik:multik_test@localhost:5432/multik_test
      SECRET_KEY: ci-only-not-for-production-1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"
        working-directory: backend

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
        working-directory: backend

      - name: Tipos (mypy strict)
        run: mypy app
        working-directory: backend

      - name: Migração do banco (alembic upgrade head)
        run: alembic upgrade head
        working-directory: backend

      - name: Testes com cobertura (pytest-cov ≥ 85%)
        run: pytest -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=85
        working-directory: backend

      - name: SAST (bandit)
        run: bandit -r app -c pyproject.toml -ll
        working-directory: backend

      - name: CVE scan (pip-audit)
        # PYSEC-2026-1845 (pytest): ignorado — pytest-asyncio<=0.26 bloqueia pytest>=9
        run: pip freeze | pip-audit -r /dev/stdin --ignore-vuln PYSEC-2026-1845
        working-directory: backend

      - name: Gate de produção — REDIS_URL obrigatório fora de dev
        run: |
          if [ "${CI_ENV:-dev}" != "dev" ] && [ -z "${REDIS_URL:-}" ]; then
            echo "ERRO: REDIS_URL ausente em ambiente não-dev. Configure a variável de ambiente."
            exit 1
          fi
          echo "OK: REDIS_URL check passou (CI_ENV=${CI_ENV:-dev})."
        working-directory: backend

      - name: Teste de arquitetura — isolamento Yelum
        run: |
          echo "Verificando que símbolos Yelum não vazam para fora de adapters/yelum/"
          if grep -ri --include="*.py" \
            "yelum\|BrokerProposalNumber\|CoverageCode\|CommercialProductCode" \
            app/domain app/api app/infra app/main.py 2>/dev/null; then
            echo "FALHA: referência a Yelum encontrada fora de adapters/yelum/"
            exit 1
          fi
          echo "OK: isolamento mantido."
        working-directory: backend

  # ---------------------------------------------------------------------------
  # Frontend — tipos e build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Node / TypeScript)
    runs-on: ubuntu-latest
    needs: secrets-scan

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install
        working-directory: frontend

      - name: Lint (eslint)
        run: npm run lint
        working-directory: frontend

      - name: Checagem de tipos (tsc)
        run: npm run type-check
        working-directory: frontend

      - name: Build de produção
        run: npm run build
        working-directory: frontend
